name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into server and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e                       # stop at the first failure, do not restart onto a half-done deploy
            cd /opt/classrec
            git pull origin main

            # A copy before the schema is touched. WAL mode keeps recent writes in
            # classrec.db-wal, so copying the .db file alone loses them — .backup
            # asks SQLite for a consistent copy of everything.
            mkdir -p backups
            sqlite3 data/classrec.db ".backup 'backups/classrec-$(date +%Y%m%d-%H%M%S).db'"

            # The newest five, and no more. A copy taken at deploy time is useful
            # for as long as it takes to see whether the migration worked; past
            # that, restoring it would throw away every lecture recorded since,
            # so it stops being something anyone would use. Keeping them all just
            # fills the disk for a reason nobody will connect to the outage.
            # This is not a backup against losing the machine — it sits on the
            # same disk. That is a different copy, somewhere else, on a schedule.
            ls -t backups/*.db 2>/dev/null | tail -n +6 | xargs -r rm --

            # The schema is brought up to what this code expects, BEFORE the code
            # starts. Restarting first would put new code in front of an old
            # database, which is the failure this line exists to prevent.
            # Safe to run every time: alembic applies only what is missing and
            # does nothing when there is nothing to apply.
            venv/bin/alembic upgrade head

            systemctl restart classrec
